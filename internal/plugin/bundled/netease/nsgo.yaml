name: 网易云音乐
id: dev.yoho.music.netease
version: 1.0.3
build_number: 4
capabilities:
  secrets: true
  host: [yoho.signInPrompt, yoho.neteaseEncode]
  network:
    http:
      - host: music.163.com
        port: 443
        schemes: [https]
        methods: [GET, POST]
        pathPrefixes: [/api]
      - host: interfacepc.music.163.com
        port: 443
        schemes: [https]
        methods: [POST]
        pathPrefixes: [/eapi]
      - host: "*.music.126.net"
        port: 443
        schemes: [https]
        methods: [GET]
